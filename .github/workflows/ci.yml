name: DuriOS Open-Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Quality Gates & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Guard against tracked secrets, databases, and private keys
        run: |
          # .env.example is intentionally tracked (see .gitignore's `!.env.example`)
          # so operators can see which DURIOS_* keys to set; exclude it by exact name.
          FORBIDDEN_FILES=$(git ls-files | grep -E '(\.env($|\.)|\.db(-shm|-wal)?$|\.(pem|key|p12|pfx)$)' | grep -vxF '.env.example' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "Forbidden secret, database, or key files tracked in git:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi

      - name: Enforce <= 179 LOC ceiling per TypeScript file
        run: |
          VIOLATIONS=$(find src test -type f -name '*.ts' -exec wc -l {} + | awk '$1 > 179 && $2 != "total"')
          if [ -n "$VIOLATIONS" ]; then
            echo "Files exceeding 179 lines:"
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: Enforce Zero-Any policy across src/ and test/
        run: |
          ANY_HITS=$(grep -rn ":\s*any\b\|as\s*any\b\|<any>" src/ test/ || true)
          if [ -n "$ANY_HITS" ]; then
            echo "Prohibited any types detected:"
            echo "$ANY_HITS"
            exit 1
          fi

      - name: Run strict TypeScript typecheck
        run: bun run typecheck

      - name: Run full test suite
        run: bun test --timeout 15000

      - name: Verify Field Auditor Go-Live Pack CLI & Standalone Manifest Verifier
        run: |
          bun run pilot:audit-pack --json > /tmp/audit-pack.json
          if bun run verify:manifest /tmp/audit-pack.json > /dev/null 2>&1; then
            echo "verify:manifest unexpectedly accepted non-manifest audit-pack JSON"
            exit 1
          fi
